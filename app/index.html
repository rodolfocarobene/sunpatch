<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunpatch app: sun and shadows inside your apartment</title>
    <meta
      name="description"
      content="Pick your building on a map, sketch your apartment and see where direct sun enters through the windows, for any date and time. Free, runs in your browser."
    />
    <link rel="canonical" href="https://rodolfocarobene.github.io/sunpatch/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sunpatch app: sun and shadows inside your apartment" />
    <meta
      property="og:description"
      content="Sketch your apartment on a real building and watch the sun patches through your windows, for any date and time."
    />
    <meta property="og:image" content="https://rodolfocarobene.github.io/sunpatch/media/screenshot-cutaway.png" />
    <meta property="og:url" content="https://rodolfocarobene.github.io/sunpatch/app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script>
      // Lofi mode before the first paint, so a reload shows no flash of the normal look (src/lofi-ui.ts keeps it in step).
      try { if (localStorage.getItem('sunpatch.lofi') === 'on') document.documentElement.dataset.lofi = 'on' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
