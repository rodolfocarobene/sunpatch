<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunpatch app: sun hours and shadows in your apartment</title>
    <meta
      name="description"
      content="Pick your building on a map, sketch your apartment and see when direct sun enters each window, with hours of sun for any date. Free, in your browser."
    />
    <link rel="canonical" href="https://rodolfocarobene.github.io/sunpatch/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sunpatch app: sun hours and shadows in your apartment" />
    <meta
      property="og:description"
      content="Pick your building on a map, sketch your apartment and see when direct sun enters each window, with hours of sun for any date. Free, in your browser."
    />
    <meta property="og:image" content="https://rodolfocarobene.github.io/sunpatch/media/screenshot-cutaway.png" />
    <meta property="og:url" content="https://rodolfocarobene.github.io/sunpatch/app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <script>
      // Lofi mode before the first paint, so a reload shows no flash of the normal look (src/lofi-ui.ts keeps it in step).
      try { if (localStorage.getItem('sunpatch.lofi') === 'on') document.documentElement.dataset.lofi = 'on' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
